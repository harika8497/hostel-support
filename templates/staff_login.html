{% extends "base.html" %}
{% block title %}Staff login{% endblock %}
{% block content %}

<h1>Staff login</h1>
<p class="subtitle">For wardens and counselors only.</p>

<form action="{{ url_for('staff_login') }}" method="POST" class="card">
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit" class="btn-primary">Log in</button>
</form>



{% endblock %}
